# Fleet-common Jetson edge settings.
# Per-machine overrides: jetsonN.yaml (extends: base.yaml)
# Tracking / map draw happen on the aggregation side.
_target_: pipeline_jetson.edge_app.EdgeApp
_recursive_: false

size: [1920, 1080]          # (W, H) — must match NV12-fused engine
max_buffers: 4              # appsink depth; with drop=true, old frames are discarded when full
capture_fps: 10             # keep ~15fps by PTS skip (30fps cam); null = every frame
drop_frames_when_lagging: true   # appsink drop=true; prefer freshness over backlog

report_every: 30
max_wall_seconds: null
max_frames: null
prefetch: true              # overlap next-frame NV12 host copy with det
prefetch_queue_size: 10

# Debug RT view of detections (off by default; costs NV12→BGR + draw + sink)
display: false
# Needs X11: export DISPLAY=:1  (this machine's GUI session)
# Alternatives: nv3dsink / ximagesink
display_sink: nveglglessink
display_point_size: 5
display_threshold: 0.4
display_color: [0, 0, 255]

detector:
  _target_: processor.detector.p2pnet_trt_nv12.P2PNetTRTNV12Detector
  # NV12-fused FP16; BT.601 limited (rebuild with --yuv-matrix bt601-limited)
  engine_path: weights/p2pnet/cutout_fhd_nv12_bt601lim.engine
  device: cuda:0
  threshold: 0.1
  img_size: [1080, 1920]    # (H, W)

publisher:
  _target_: pipeline_jetson.components.edge.publisher.Publisher
  broker_host: 192.168.0.100   # aggregation / mosquitto host
  broker_port: 1883
